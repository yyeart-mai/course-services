version: 1
disable_existing_loggers: false

formatters:
  base:
    format: "%(asctime)s | request_id=%(request_id)s | %(process)d | %(thread)s | %(levelname)s | %(name)s | %(funcName)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

filters:
  request_id:
    (): src.web.logging_context.RequestIdFilter

handlers:
  console:
    class: logging.StreamHandler
    formatter: base
    filters: [request_id]
    stream: ext://sys.stdout

loggers:
  src:
    level: DEBUG
    handlers: [console]

root:
  level: INFO
  handlers: [console]